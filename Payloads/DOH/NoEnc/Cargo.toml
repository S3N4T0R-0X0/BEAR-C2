[package]
name = "DOH_NoEnc"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "DOH_NoEnc"
path = "DOH_NoEnc.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
base32 = "0.5"
sha3 = "0.10"
sha2 = "0.10"
rand = "0.8"
hickory-proto = "0.24"
chrono = "0.4"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
