[package]
name = "QUIC_NoEnc"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "QUIC_NoEnc"
path = "QUIC_NoEnc.rs"

[dependencies]
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
serde_json = "1"
dirs = "5"
chrono = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
] }

[profile.release]
opt-level = "z"
lto = true
strip = true
