[package]
name = "QUIC_DES"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "QUIC_DES"
path = "QUIC_DES.rs"

[dependencies]
base64 = "0.22"
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5"
chrono = "0.4"
rand = "0.8"
des = "0.8"
cbc = { version = "0.1", features = ["alloc"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
